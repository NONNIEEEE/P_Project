<style>

  #screen{flex:1;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column}
  .view>*{flex-shrink:0}
  ::-webkit-scrollbar{display:none} *{scrollbar-width:none}
  @keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
  .scanline{animation:scan 2.4s ease-in-out infinite}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .pop{animation:pop .18s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet{animation:up .22s ease-out}
  .spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>

const TAG={

  UPLINK:{c:'border-orange-300 text-orange-700 bg-orange-50',i:'ph-shield',l:'UPLINK'},
  UNKNOWN:{c:'border-orange-300 text-orange-700 bg-orange-50',i:'ph-question',l:'UNKNOWN'},
};
const badge=(tag,sz='text-[11px]')=>tag?`<span class="${sz} border ${TAG[tag].c} px-2 py-0.5 rounded-md font-semibold inline-flex items-center gap-1 whitespace-nowrap"><i class="ph-bold ${TAG[tag].i}"></i>${TAG[tag].l}</span>`:'';
const vlanName=id=>(S.vlans.find(v=>v.id===id)||{}).name;
const isAdmin=()=>S.role==='admin';
function go(v){S.view=v;S.menu=false;S.sheet=false;render(true)}
function snack(msg,kind='ok'){S.snack={msg,kind};render();clearTimeout(window._sn);window._sn=setTimeout(()=>{S.snack=null;render()},2600)}
function closeModal(){S.modal=null;render()}
function seg(opts,cur,fn){return `<div class="flex rounded-full border border-gray-400 overflow-hidden">${opts.map(([v,l],i)=>`<button onclick="${fn}('${v}')" class="flex-1 py-2.5 px-4 text-sm flex items-center justify-center gap-2 ${i?'border-l border-gray-400':''} ${cur===v?'bg-indigo-100 text-gray-900':'bg-white hover:bg-gray-50'}">${cur===v?'<i class="ph-bold ph-check"></i>':''}${l}</button>`).join('')}</div>`}
const input=(key,ph,type='text')=>`<input type="${type}" value="${esc(S.form[key])}" oninput="S.form.${key}=this.value" placeholder="${ph}" class="w-full border border-[#EDE6D3] rounded-2xl px-5 py-4 text-base placeholder-gray-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">`;
const backBtn=(fn,label='ย้อนกลับ')=>`<button onclick="${fn}" class="flex items-center gap-1 text-gray-500 hover:text-gray-800 text-[15px]"><i class="ph ph-caret-left"></i>${label}</button>`;
const serverWarn=()=>S.serverOnline?'':`<p class="text-red-600 text-sm flex items-center gap-1.5 mb-6"><span>⚠️</span>ติดต่อ NetOps Server ไม่ได้ — Apply จะถูกปฏิเสธ (Fail-closed)</p>`;

  <div class="absolute -right-8 -top-5 z-30 bg-white rounded-md shadow-2xl w-72 py-2 pop">
    <p class="px-5 py-3 text-gray-500">ผู้ใช้: ${esc(S.user)}</p>

    ${item("go('editor')",'ph-rows','Block Editor')}
    ${item("go('netops')",'ph-graph','NetOps Server')}
    ${item("go('audit')",'ph-receipt','Audit Trail Log')}
    ${item("go('ssh')",'ph-terminal-window','SSH Console')}

V.ports=()=>{
  const p=S.ports[S.selPort], on=S.deviceOnline;
  const cards=S.ports.map((q,i)=>{
    const sel=i===S.selPort;
    const cls=sel?'bg-gray-900 text-white':!q.admin?'bg-gray-200 text-gray-500':q.up?'bg-[#D1FAE5] text-green-800':'bg-red-50 text-red-700';
    return `<button onclick="S.selPort=${i};render()" class="${cls} rounded-2xl h-28 relative grid place-items-center transition hover:brightness-95">
      ${q.tag?`<i class="ph-fill ph-lock-key text-sm absolute top-2.5 right-3 ${sel?'text-gray-300':'text-green-700'}"></i>`:''}
      <span class="text-xl font-bold">${pad(i+1)}</span><span class="absolute bottom-2 left-3 text-[11px] opacity-70">${q.n}${!q.admin?' · shut':q.errdis?' · err-dis':q.ch?' · Po'+q.ch:q.mode==='trunk'?' · trunk':''}</span></button>`}).join('');
  const st=!p.admin?'<span class="text-gray-500 font-medium">Administratively Down</span>':p.errdis?`<span class="text-red-600 font-medium">err-disabled (${p.errdis})</span>`:p.up?'<span class="text-green-600 font-medium">Link Up</span>':'<span class="text-red-600 font-medium">Link Down</span>';

const ip2n=s=>s.split('.').reduce((a,x)=>a*256+(+x),0);
const n2ip=n=>[24,16,8,0].map(k=>(n>>>k)&255).join('.');
const bits=s=>ip2n(s).toString(2).padStart(32,'0');
const maskOk=s=>ipOk(s)&&/^1*0*$/.test(bits(s));
const wildOk=s=>ipOk(s)&&/^0*1*$/.test(bits(s));
const pfx=m=>(bits(m).match(/1/g)||[]).length;
const pfx2mask=n=>n2ip(n?(0xFFFFFFFF<<(32-n))>>>0:0);
const netOf=(ip,m)=>n2ip((ip2n(ip)&ip2n(m))>>>0);
const inNet=(ip,net,m)=>netOf(ip,m)===netOf(net,m);
const inWild=(ip,net,w)=>((ip2n(ip)&~ip2n(w))>>>0)===((ip2n(net)&~ip2n(w))>>>0);
const parseList=s=>{const out=[];String(s||'').split(/[,\s]+/).filter(Boolean).forEach(x=>{const m=x.match(/^(\d+)-(\d+)$/);if(m){for(let i=+m[1];i<=+m[2]&&out.length<4094;i++)out.push(i)}else out.push(+x)});return [...new Set(out)].sort((a,b)=>a-b)};
const fmtList=l=>{if(!l||!l.length)return 'none';const r=[];let a=l[0],b=l[0];for(const x of l.slice(1)){if(x===b+1)b=x;else{r.push(a===b?a:a+'-'+b);a=b=x}}r.push(a===b?a:a+'-'+b);return r.join(',')};

      if(b.op==='del'){if(!ex)return c.skip();const last=st.ospf.filter(o=>o.pid===b.pid).length===1;
        r.cli=last?[`no router ospf ${b.pid}`]:[`router ospf ${b.pid}`,' no'+nl];r.rb=[`router ospf ${b.pid}`,` network ${ex.net} ${ex.wild} area ${ex.area}`];c.danger('neighbor ใน network นี้จะหลุด');st.ospf.splice(st.ospf.indexOf(ex),1);return}

};

/* ---------- Dry-run analysis: simulate every block against a copy of live state ---------- */
function analyze(blocks){
  const st=confSnap();
  const res=blocks.map(b=>{
    const r={b,status:'ok',note:'',cli:[],rb:[],verify:''},E=CAT[b.kind];
    const c={st,r,p:b.iface!=null?st.ports[b.iface]:null,
      block:m=>{r.status='blocked';r.note=m;return false},
      skip:(m='ไม่มีการเปลี่ยนแปลง — ข้าม')=>{if(r.status!=='blocked'){r.status='skip';r.note=m}},
      note:m=>{r.note=r.note?r.note+' · '+m:m},
      danger:m=>{if(r.status!=='blocked'&&r.status!=='skip'){r.status='danger';c.note(m)}},
      vlanExists:id=>st.vlans.some(v=>v.id===id),
      notCh:()=>!c.p.ch||c.block(`พอร์ตอยู่ใน Port-channel${c.p.ch} — ตั้งค่าที่ Port-channel แทน`),
      connected:ip=>st.svis.some(s=>s.up&&inNet(ip,s.ip,s.mask)&&ip!==s.ip),
      needRouting:()=>{if(st.ipRouting)return {pre:[],post:[]};st.ipRouting=true;
        const hasDef=st.routes.some(x=>x.net==='0.0.0.0');if(!hasDef)st.routes.push({net:'0.0.0.0',mask:'0.0.0.0',nh:st.gw});
        c.note(`เปิด ip routing — เพิ่ม default route ไป ${st.gw} ให้อัตโนมัติ เพราะ ip default-gateway จะถูกเพิกเฉยเมื่อเปิด routing (กัน management หลุด)`);
        return {pre:['ip routing',...(hasDef?[]:[`ip route 0.0.0.0 0.0.0.0 ${st.gw}`])],post:[...(hasDef?[]:[`no ip route 0.0.0.0 0.0.0.0 ${st.gw}`]),'no ip routing']}},
      guard:()=>{const q=c.p;if(!q)return true;
        if(q.tag==='MGMT')return c.block(`${longName(q.n)} ${MGMT_REASON}`);
        if(q.tag){if(!isAdmin())return c.block('PROTECTED uplink: ADMIN confirmation required (คุณเป็น Operator)');r.status='admin';c.note('PROTECTED uplink — ต้องพิมพ์ hostname ยืนยัน')}
        return true}};
    if(!E)c.block('ไม่รู้จักบล็อกนี้');
    else if(E.admin&&!isAdmin())c.block(`${E.t} ต้องเป็น Admin`);
    else E.an(b,c,r);
    if(r.status==='ok'&&!r.cli.length&&!r.note)c.skip();
    return r});
  res.final=st;return res;
}

function vlanOpts(mode){
  const pend=S.blocks.filter(b=>b.kind==='vlan'&&b.op==='create'&&!S.vlans.some(v=>v.id===b.vlan)).map(b=>[b.vlan,`VLAN ${b.vlan} - ${b.name||'(ใหม่ในชุดบล็อก)'}`]);
  let base=S.vlans.filter(v=>v.id<1002).map(v=>[v.id,`VLAN ${v.id} - ${v.name}${S.svis.some(s=>s.vlan===v.id)?' · มี SVI':''}`]).concat(pend);
  if(mode==='voice')base=[['none','ไม่ใช้ voice VLAN'],...base.filter(([id])=>id!==1)];
  if(mode==='sviv'){const pendSvi=S.blocks.filter(b=>b.kind==='svi'&&b.state!=='remove').map(b=>b.vlan);base=base.filter(([id])=>S.svis.some(s=>s.vlan===id)||pendSvi.includes(id))}
  return base.length?base:[['','— ไม่มี VLAN ที่ใช้ได้ —']];
}
function segF(key,opts){return `<div class="flex rounded-full border border-gray-400 overflow-hidden">${opts.map(([v,l],i)=>`<button onclick="S.form.${key}='${v}';render()" class="flex-1 py-2.5 px-3 text-sm flex items-center justify-center gap-2 ${i?'border-l border-gray-400':''} ${S.form[key]===v?'bg-indigo-100 text-gray-900':'bg-white hover:bg-gray-50'}">${S.form[key]===v?'<i class="ph-bold ph-check"></i>':''}${l}</button>`).join('')}</div>`}
function fieldHtml([key,type,label,opts,show]){
  if(show&&!show(S.form))return '';
  const lab=`<label class="text-sm text-gray-500 mb-1 block">${label}</label>`;
  const sel=items=>`<select onchange="S.form.${key}=this.value;${key==='iface'?'blkIface()':'render()'}" class="w-full border border-[#EDE6D3] rounded-2xl px-5 py-4 text-base bg-white">${items.map(([v,l])=>`<option value="${v}" ${String(S.form[key])===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;

  else if(type==='vlan')h=sel(vlanOpts(opts));

function openBlk(k,iface){const E=CAT[k];S.sheet=false;

const col=(v,w)=>String(v).padEnd(w).slice(0,w);
const pstat=p=>!p.admin?'disabled':p.errdis?'err-disabled':p.up?'connected':'notconnect';
const macOf=(i,k=1)=>`5254.00${pad(i)}.${String(k).padStart(2,'0')}a${i}`;
const CDP={'Gi0/0':['R1-gateway','192.168.1.1','GigabitEthernet0/1','Cisco IOSv Router'],'Gi0/2':['core-sw1','192.168.1.2','GigabitEthernet1/0/24','Cisco IOSvL2'],'Gi0/3':['dist-sw2','192.168.1.3','GigabitEthernet0/1','Cisco IOSvL2'],'Gi0/4':['dist-sw3','192.168.1.4','GigabitEthernet0/1','Cisco IOSvL2'],'Gi0/5':['dist-sw4','192.168.1.5','GigabitEthernet0/1','Cisco IOSvL2']};
function portCfg(p){const L=[I(p)];
  if(p.desc)L.push(` description ${p.desc}`);
  if(p.mode==='trunk'){L.push(' switchport trunk encapsulation dot1q');if(p.native!==1)L.push(` switchport trunk native vlan ${p.native}`);if(p.allowed)L.push(` switchport trunk allowed vlan ${fmtList(p.allowed)}`);L.push(' switchport mode trunk')}
  else{if(p.vlan!==1)L.push(` switchport access vlan ${p.vlan}`);L.push(' switchport mode access');if(p.voice!=null)L.push(` switchport voice vlan ${p.voice}`)}
  if(p.ps){L.push(' switchport port-security',...(p.ps.max>1?[` switchport port-security maximum ${p.ps.max}`]:[]),...(p.ps.viol!=='shutdown'?[` switchport port-security violation ${p.ps.viol}`]:[]),...(p.ps.sticky?[' switchport port-security mac-address sticky']:[]))}
  if(p.speed!=='auto')L.push(` speed ${p.speed}`);if(p.duplex!=='auto')L.push(` duplex ${p.duplex}`);
  L.push(' negotiation auto');if(p.ch)L.push(` channel-group ${p.ch} mode ${(S.channels.find(c=>c.g===p.ch)||{}).mode||'active'}`);

function runShow(){const d=S.diag,c=SH.find(x=>x[0]===d.cmd);let a=d.arg;

const modalFoot=(fn,label='บันทึก',cancel='ยกเลิก')=>`${S.form.err?`<p class="text-red-600 text-sm mt-3">${esc(S.form.err)}</p>`:''}<div class="text-right mt-6 mb-4"><button onclick="closeModal()" class="text-gray-600 px-4 py-2">${cancel}</button></div><button onclick="${fn}" class="w-full bg-primary hover:bg-blue-700 text-white rounded-2xl py-4 text-lg font-semibold">${label}</button>`;
const portSelect=key=>`<select onchange="S.form.${key}=+this.value;render()" class="w-full border border-[#EDE6D3] rounded-2xl px-5 py-4 text-base bg-white">${S.ports.map((p,i)=>`<option value="${i}" ${S.form[key]===i?'selected':''}>${p.n} · vlan ${p.vlan} · ${p.admin?'up':'down'}${p.tag?' · '+TAG[p.tag].l:''}</option>`).join('')}</select>`;
function portNote(i){const p=S.ports[i];
  if(p.tag==='MGMT')return `<p class="text-red-600 text-sm mt-2 flex gap-1.5"><i class="ph ph-lock-simple mt-0.5"></i>${MGMT_REASON} — Dry-Run จะปฏิเสธ</p>`;
  if(p.tag)return `<p class="text-orange-700 text-sm mt-2 flex gap-1.5"><i class="ph ph-shield-warning mt-0.5"></i>PROTECTED uplink: ADMIN confirmation required${isAdmin()?'':' — คุณเป็น Operator'}</p>`;return ''}

function modalHtml(){
  const m=S.modal, f=S.form;
  if(m.type==='vlan'){
    let body=input('vlan','VLAN ID','number');
    if(f.mode==='create')body+=`<div class="mt-4">${input('name','ชื่อ VLAN (ไม่บังคับ)')}</div>`;
    if(f.mode==='rename')body+=`<div class="mt-4">${input('name','ชื่อใหม่')}</div>`;
    if(f.mode==='delete')body+=`<p class="text-red-600 mt-4">การลบ VLAN เป็นคำสั่งอันตราย: ต้องเป็น Admin และพิมพ์ชื่ออุปกรณ์ยืนยันตอน Apply</p>`;
    return modalWrap(`<h2 class="text-3xl mb-6">บล็อก VLAN</h2><div class="mb-5">${seg([['create','สร้าง'],['rename','เปลี่ยนชื่อ'],['delete','ลบ']],f.mode,'setVlanMode')}</div>${body}${modalFoot('saveVlan()')}`);
  }
  if(m.type==='access'){
    const opts=S.vlans.filter(v=>v.id<1002).map(v=>`<option value="${v.id}" ${f.vlan===v.id?'selected':''}>VLAN ${v.id} - ${esc(v.name)}</option>`).join('');
    const pend=S.blocks.filter(b=>b.kind==='vlan'&&b.op==='create'&&!S.vlans.some(v=>v.id===b.vlan)).map(b=>`<option value="${b.vlan}" ${f.vlan===b.vlan?'selected':''}>VLAN ${b.vlan} - ${esc(b.name||'(ใหม่ในชุดบล็อก)')}</option>`).join('');
    return modalWrap(`<h2 class="text-3xl mb-6">บล็อก Access Port VLAN</h2>
      <label class="text-sm text-gray-500 mb-1 block">อินเทอร์เฟซ</label>${portSelect('iface')}${portNote(f.iface)}
      <label class="text-sm text-gray-500 mb-1 mt-4 block">VLAN ปลายทาง</label>
      <select onchange="S.form.vlan=+this.value" class="w-full border border-[#EDE6D3] rounded-2xl px-5 py-4 text-base bg-white">${opts}${pend}</select>
      <p class="text-xs text-gray-500 mt-2">คำสั่ง: switchport mode access / switchport access vlan &lt;id&gt;</p>${modalFoot('saveAccess()')}`);

  if(m.type==='iface'){
    return modalWrap(`<h2 class="text-3xl mb-6">บล็อก Interface Up/Down</h2>
      <label class="text-sm text-gray-500 mb-1 block">อินเทอร์เฟซ</label>${portSelect('iface')}${portNote(f.iface)}

    if(m.result)return modalWrap(`<h2 class="text-3xl mb-2">🤖 AI Assistant</h2><p class="text-gray-500 mb-4">ร่างบล็อกให้ ${m.result.length} บล็อก — ยังต้อง Dry-Run และยืนยันเองเสมอ</p>
      <div class="space-y-2">${m.result.map(b=>`<div class="flex items-center gap-3 border rounded-xl p-3"><span class="w-9 h-9 rounded-full grid place-items-center ${CAT[b.kind].cl}"><i class="ph ${CAT[b.kind].ic}"></i></span><span class="font-medium">${blockText(b)}</span></div>`).join('')}</div>
      ${(m.notes||[]).map(x=>`<p class="text-sm text-orange-700 mt-3 flex gap-1.5"><i class="ph ph-warning mt-0.5"></i>${esc(x)}</p>`).join('')}
      ${modalFoot('acceptAI()','เพิ่มลงชุดบล็อก')}`);
    return modalWrap(`<h2 class="text-3xl mb-4">🤖 AI Assistant</h2><p class="text-gray-500 mb-2">อุปกรณ์: s1</p>
      <textarea maxlength="1000" oninput="S.form.ai=this.value;$('aic').textContent=this.value.length+'/1000'" rows="3" placeholder="เช่น สร้าง VLAN 30 ชื่อ CCTV แล้วใส่พอร์ต Gi0/1 เข้า VLAN 30" class="w-full border border-[#EDE6D3] rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-primary">${esc(f.ai)}</textarea>

      ${S.serverOnline?'':'<p class="text-red-600 text-sm mt-3">AI Assistant ทำงานผ่าน NetOps Server — ตอนนี้ติดต่อไม่ได้</p>'}

    ${modalFoot('addUser()','Add','Cancel')}`,true,'max-w-md');
  if(m.type==='resetPw')return modalWrap(`<h2 class="text-3xl mb-2">Reset password</h2><p class="text-gray-500 mb-5">ผู้ใช้: ${esc(S.users[m.i].name)} · ผู้ใช้จะต้องเปลี่ยนรหัสเมื่อเข้าสู่ระบบครั้งถัดไป</p>
    <div class="space-y-3">${input('pw','Password (10-128 chars)','password')}${input('pw2','Confirm password','password')}</div>${modalFoot('resetPw()','Reset','Cancel')}`,true,'max-w-md');

      ${modalFoot('trustDevice()','เชื่อถือและเพิ่มอุปกรณ์','ยกเลิก')}`,true,'max-w-lg');

      ${input('user','SSH user')}${input('pass','SSH password','password')}<div class="col-span-2">${input('loc','ตำแหน่งตู้ (ไม่บังคับ)')}</div></div>

  if(m.type==='pipeline'){
    const ic=s=>s==='done'?'<i class="ph-fill ph-check-circle text-green-600 text-2xl"></i>':s==='run'?'<i class="ph ph-spinner spin text-primary text-2xl"></i>':s==='fail'?'<i class="ph-fill ph-x-circle text-red-600 text-2xl"></i>':s==='rb'?'<i class="ph-fill ph-arrow-counter-clockwise text-orange-600 text-2xl"></i>':'<i class="ph ph-circle text-gray-300 text-2xl"></i>';
    return modalWrap(`<h2 class="text-2xl font-bold mb-1">Pipeline · s1</h2><p class="text-gray-500 mb-5">${m.done?'เสร็จสิ้น':'กำลังทำงาน — อย่าปิดแอปหรือตัด Wi-Fi'}</p>
      <div class="space-y-3">${m.steps.map(s=>`<div class="flex items-start gap-3">${ic(s.st)}<div><p class="font-medium ${s.st==='wait'?'text-gray-400':''}">${s.l}</p>${s.d?`<p class="text-xs text-gray-500">${s.d}</p>`:''}</div></div>`).join('')}</div>
      ${m.done?`<div class="mt-6 rounded-2xl p-4 ${m.ok?'bg-green-50 text-green-800':'bg-orange-50 text-orange-800'}"><p class="font-semibold">${m.ok?'Applied and verified — all post-conditions hold':'Verification failed → Rollback สำเร็จ สถานะกลับเหมือนเดิม'}</p><p class="text-sm">${m.ok?'ยังไม่ได้ save ลง startup-config':'แจ้งเตือนกลุ่ม Admin ผ่าน Telegram Guard แล้ว'}</p></div>
      <div class="flex gap-3 mt-5"><button onclick="S.modal=null;S.tab='history';go('device')" class="flex-1 rounded-2xl py-3 bg-gray-100 font-semibold">ดูประวัติ</button><button onclick="S.modal=null;go(S.dry.from==='config'?'config':'editor')" class="flex-1 rounded-2xl py-3 bg-primary text-white font-semibold">เสร็จ</button></div>`:''}`,false,'max-w-lg');
  }
  return '';
}

function qrCells(){let h='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(a,b)=>x>=a&&x<a+7&&y>=b&&y<b+7;let on;
  const fin=f(0,0)?[0,0]:f(14,0)?[14,0]:f(0,14)?[0,14]:null;
  if(fin){const dx=x-fin[0],dy=y-fin[1];on=dx===0||dy===0||dx===6||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4)}else on=((x*7+y*13+x*y)%5)<2;
  h+=`<span class="${on?'bg-gray-900':''}"></span>`}return h}

  if(a==='kickall'){const n=dropSessions(u.name);audit('app',`session.kick_all: ${u.name} (${n} sessions)`);snack(n?`Force logout ${u.name} แล้ว ${n} session`:`${u.name} ไม่มี session ที่ใช้งานอยู่`,n?'ok':'info');return}

function kickSession(id){const x=S.sessions.find(z=>z.id===id),r=(S.form.reason||'').trim();

function fetchHostKey(){const f=S.form;let e='';

function saveVlan(){const f=S.form,id=parseInt(f.vlan),ex=S.vlans.some(v=>v.id===id),name=(f.name||'').trim();let e='';
  if(!id||id<1||id>4094)e='VLAN ID ต้องอยู่ระหว่าง 1–4094';
  else if(RESERVED.includes(id))e=`VLAN ${id} เป็น VLAN ระบบ แก้ไข/ลบไม่ได้`;

function openAI(){S.form={ai:''};S.modal={type:'ai'};render()}
function askAI(){if(!S.serverOnline){snack('AI Assistant ต้องเชื่อมต่อ NetOps Server','err');return}
  let t=' '+(S.form.ai||'')+' ';const out=[],notes=[];
  const IP='(\\d{1,3}(?:\\.\\d{1,3}){3})',G='gi(?:gabitethernet)?\\s*0\\/(\\d)',sp='\\s*';
  const eat=(re,fn)=>{t=t.replace(new RegExp(re,'ig'),(...a)=>{fn(a);return ' '})};
  const port=x=>{const n=+x;return n>=0&&n<8?n:null};
  const mask=(m1,m2)=>m2?m2:m1!=null?pfx2mask(+m1):'255.255.255.0';
  // ⛔ refused on purpose
  const bad=t.match(/(username|enable\s*secret|\baaa\b|line\s*vty|ip\s*ssh|crypto\s*key|erase|delete\s*flash|\bformat\b|boot\s*system|\bdebug\b|hostname)/i);
  if(bad){notes.push(`⛔ ไม่รองรับ "${bad[1]}" โดยเจตนา — คำสั่งนี้อาจทำให้แอปเข้าสวิตช์ไม่ได้หรือทำลายข้อมูล`);t=t.replace(new RegExp(bad[1],'ig'),' ')}
  if(/\bshow\b|\bping\b|traceroute/i.test(t))notes.push('คำสั่ง show / ping / traceroute ใช้ที่แท็บ Diagnostics ของหน้าอุปกรณ์ (ไม่ต้องสร้างบล็อก)');
  if(/save|write\s*mem|บันทึกถาวร/i.test(t))notes.push('การบันทึกถาวร (write memory) อยู่ที่ Device Actions — ทำหลัง Apply สำเร็จ');
  if(/reload|รีโหลด|รีสตาร์ต|reboot/i.test(t))notes.push('Reload / reload in อยู่ที่ Device Actions (ต้องยืนยันด้วย hostname)');
  // trunk
  eat(`(?:เอา|ลบ|remove)${sp}vlan${sp}([\\d,\\-\\s]+?)${sp}(?:ออกจาก|from)${sp}trunk${sp}(?:พอร์ต|port)?${sp}${G}`,a=>{const i=port(a[2]);if(i!=null)out.push({kind:'trunk',iface:i,op:'remove',list:parseList(a[1]),native:1,avlan:1})});
  eat(`(?:เพิ่ม|add)${sp}vlan${sp}([\\d,\\-\\s]+?)${sp}(?:เข้า|ใน|to|into)${sp}trunk${sp}(?:พอร์ต|port)?${sp}${G}`,a=>{const i=port(a[2]);if(i!=null)out.push({kind:'trunk',iface:i,op:'add',list:parseList(a[1]),native:1,avlan:1})});
  eat(`(?:native${sp}vlan)${sp}(\\d+)${sp}(?:ที่|บน|on)?${sp}(?:พอร์ต|port)?${sp}${G}`,a=>{const i=port(a[2]);if(i!=null)out.push({kind:'trunk',iface:i,op:'native',list:[],native:+a[1],avlan:1})});
  eat(`(?:พอร์ต|port)?${sp}${G}${sp}(?:เป็น|to|=)${sp}trunk(?:[^\\d\\n]{0,25}?(?:allowed|อนุญาต|ให้ผ่าน)?${sp}vlan${sp}([\\d,\\-]+(?:\\s*,\\s*[\\d\\-]+)*))?`,a=>{const i=port(a[1]);if(i!=null)out.push({kind:'trunk',iface:i,op:'to-trunk',list:parseList(a[2]),native:1,avlan:1})});
  // EtherChannel
  eat(`(?:etherchannel|port-?channel|lacp|รวมพอร์ต)${sp}(\\d+)?[^\\n]*?${G}${sp}(?:กับ|และ|,|and|\\+)${sp}${G}`,a=>{const i=port(a[2]),k=port(a[3]);if(i!=null&&k!=null)out.push({kind:'etherchannel',iface:i,iface2:k,group:+(a[1]||1),mode:'active'})});
  // HSRP / OSPF / routes / SVI / gateway
  eat(`hsrp${sp}(?:group${sp})?(\\d+)?${sp}(?:บน|on|ที่)?${sp}vlan${sp}(\\d+)${sp}(?:vip|virtual${sp}ip|ip)?${sp}${IP}(?:[^\\d\\n]{0,15}(?:priority|prio)${sp}(\\d+))?`,a=>out.push({kind:'hsrp',op:'set',vlan:+a[2],grp:+(a[1]||1),vip:a[3],prio:+(a[4]||110),pre:true}));
  eat(`ospf${sp}(\\d+)?${sp}(?:network)?${sp}${IP}${sp}(?:\\/${sp}(\\d{1,2})|\\s+${IP})?${sp}area${sp}(\\d+)`,a=>{const w=a[3]!=null?n2ip((~ip2n(pfx2mask(+a[3])))>>>0):a[4]||'0.0.0.255';out.push({kind:'ospf',op:'add',pid:+(a[1]||1),net:a[2],wild:w,area:+a[5]})});
  eat(`(?:static${sp}route|ip${sp}route|เส้นทาง)${sp}${IP}${sp}(?:\\/${sp}(\\d{1,2})|\\s+${IP})${sp}(?:via|ผ่าน|next-?hop)?${sp}${IP}`,a=>{const m=mask(a[2],a[3]);out.push({kind:'route',op:'add',net:netOf(a[1],m),mask:m,nh:a[4]})});
  eat(`(?:svi${sp}(?:vlan)?|interface${sp}vlan|ip${sp}(?:ให้|ของ)?${sp}vlan|ไอพี${sp}vlan)${sp}(\\d+)${sp}(?:ip|=|เป็น)?${sp}${IP}(?:${sp}\\/${sp}(\\d{1,2})|\\s+${IP})?`,a=>out.push({kind:'svi',vlan:+a[1],state:'up',ip:a[2],mask:mask(a[3],a[4])}));
  eat(`(?:default${sp}-?${sp}gateway|เกตเวย์)${sp}(?:เป็น|=)?${sp}${IP}`,a=>out.push({kind:'gw',ip:a[1]}));
  // Port Security
  eat(`(?:port${sp}-?${sp}security|พอร์ตซีเคียว)${sp}(?:ที่|บน|on)?${sp}(?:พอร์ต|port)?${sp}${G}([^\\n]{0,60})`,a=>{const i=port(a[1]),rest=a[2]||'';if(i==null)return;
    if(/ปิด|off|disable/i.test(rest)){out.push({kind:'portsec',iface:i,on:false,max:1,viol:'restrict',sticky:false});return}
    const mx=rest.match(/(?:max(?:imum)?|สูงสุด)\s*(\d+)/i),vi=rest.match(/protect|restrict|shutdown/i);
    out.push({kind:'portsec',iface:i,on:true,max:mx?+mx[1]:1,viol:vi?vi[0].toLowerCase():'restrict',sticky:/sticky/i.test(rest)||!/no\s*sticky/i.test(rest)})});

function applyPipeline(){
  const all=analyze(S.dry.blocks),res=all.filter(r=>r.cli.length);
  const net=res.some(r=>CAT[r.b.kind].net),useNet=net&&(res.some(r=>CAT[r.b.kind].net==='force')||S.useNet);
  const n=++S.snap,fail=S.simFail,t=()=>nowStr().slice(11),pre=confSnap();
  const verifies=[...new Set(res.map(r=>r.verify).filter(Boolean))];
  const steps=[
    {l:'ขอ Global Lock จาก NetOps Server',d:'job #'+(41+n)+' · ไม่มีผู้ใช้อื่นถือ lock'},
    {l:`Snapshot running-config (#${n})`,d:'secrets masked · ใช้ configure replace ย้อนได้ทั้งไฟล์'},
    {l:'Uplink/Management Protection (live state)',d:'MGMT/UPLINK ไม่เปลี่ยนจาก Dry-Run'},
    ...(useNet?[{l:'ตั้งตาข่ายกันพลาด: reload in 10',d:'Reload scheduled in 10 minutes'}]:[]),
    {l:`ส่ง ${res.reduce((a,r)=>a+r.cli.length,0)} บรรทัดคำสั่งผ่าน SSH`,d:'configure terminal … end'},
    {l:'ตรวจผล post-conditions',d:verifies.join(' · ')||'—',verify:1},
    ...(useNet?[{l:'ยกเลิกตาข่าย: reload cancel',d:'--- SHUTDOWN ABORTED ---'}]:[])
  ].map((x,i)=>({...x,l:(i+1)+'. '+x.l,st:'wait'}));
  S.modal={type:'pipeline',steps,done:false};render();
  const finish=()=>{
    S.console.push(`[${t()}] lock released`);
    const at=nowStr(),d=res.map(r=>blockText(r.b)).join(', ');
    S.snapStore[n]=pre;S.snapMeta[n]={at,d};
    S.history.unshift({t:'info',title:`Snapshot #${n} taken`,at,by:S.user,d:`snapshot ${n}`});
    const cl=res.flatMap(r=>r.cli),rbl=[...res].reverse().flatMap(r=>r.rb);
    const vcmd=verifies.filter(v=>/^(show|ping)/.test(v)).map(v=>'>'+v.split(' (')[0].split(' →')[0]);
    sshLog([...(useNet?['>reload in 10','<Reload scheduled in 10 minutes by netops on vty0 (192.168.1.120)','<Proceed with reload? [confirm]','>y']:[]),
      '>show running-config','<Building configuration... (snapshot #'+n+', secrets masked)','>configure terminal',...cl.map(c=>'>'+c),'>end',...vcmd,
      ...(fail?['!verify FAILED — sending inverse commands','>configure terminal',...rbl.map(c=>'>'+c),'>end','!original state verified']:['!all post-conditions hold']),
      ...(useNet?['>reload cancel','<***','<*** --- SHUTDOWN ABORTED ---','<***']:[])]);
    audit('s1 (192.168.1.50)',(fail?'change.rollback: ':'change.apply: ')+d,!fail);
    if(fail){S.history.unshift({t:'warn',title:'Verification failed — rolled back',at,by:S.user,d:d+' · original state verified',port:portOf(res)})}
    else{applyChanges(all.final);S.unsaved.push({at,by:S.user,d,cli:cl});
      S.history.unshift({t:'ok',title:'Applied and verified',at,by:S.user,d:d+' · all post-conditions hold',port:portOf(res)});
      if(S.dry.from==='editor')S.blocks=S.blocks.filter(b=>!b.on);S.lastVerified=at}
    S.modal.done=true;S.modal.ok=!fail;S.simFail=false;render()};
  let i=0;
  const tick=()=>{
    if(i>0){const x=steps[i-1];
      if(x.verify&&fail){x.st='fail';x.d='post-condition ไม่ผ่าน';steps.splice(i,0,{l:'↺ Auto-Rollback: ส่ง inverse commands และตรวจสถานะเดิม',st:'rb',d:'original state verified'});i++;S.console.push(`[${t()}] verify FAILED → rollback sent, original state verified`)}
      else{x.st='done';S.console.push(`[${t()}] ${x.l.replace(/^\d+\. /,'')} — ok`)}}
    if(i<steps.length){steps[i].st='run';i++;render();setTimeout(tick,650);return}
    finish()};
  tick()}

 {t:'ตรวจผลด้วยคำสั่ง show',b:`${TB('หน้าสถานะพอร์ต','⚙️ มุมขวาบน','แท็บ Diagnostics')}<br>กดเลือกคำสั่ง → ถ้ามีช่องให้เลือกพอร์ต/VLAN/IP → <b>▶ รัน</b><br><span class="text-gray-500">ผลเปลี่ยนตามสิ่งที่เพิ่ง Apply เช่น เพิ่ม SVI แล้วรัน show ip interface brief จะเห็น Vlan100</span>`,go:()=>{tourReady();S.tab='diag';go('device')},demo:()=>{tourReady();S.tab='diag';S.diag={cmd:'status',arg:''};go('device');runShow()}},

 {t:'บันทึกถาวร / Reload / ย้อนคอนฟิก',b:`${TB('หน้า sw1','⋮','Device Actions')}<br>• 💾 การ์ดบนสุดแสดง diff ที่ยังไม่ save → <b>บันทึกลง startup-config</b><br>• ลอง <b>Reload</b> ก่อน save → การเปลี่ยนแปลงหายจริง<br>• <b>configure replace</b> ย้อนทั้งไฟล์ไป snapshot ไหนก็ได้`,go:()=>{tourReady();go('actions')}},
 {t:'ประวัติ ผู้ใช้ และ session',b:`${TB('Dashboard','⋮')}<br>• <b>Audit Trail Log</b> — ทุกการกระทำ ค้นหาได้ ส่งออก CSV<br>• <b>SSH Console</b> — คำสั่งที่แอปส่งจริงและ output ของสวิตช์<br>• <b>จัดการผู้ใช้</b> — เพิ่มผู้ใช้ เปลี่ยนบทบาท และ <b>Kick</b> session ที่ใช้งานอยู่`,go:()=>{tourReady();go('audit')}},

function tourGo(k){const x=TOUR[S.tour.i];(k==='demo'?x.demo:x.go)();render()}
function tourStep(d){S.tour.i=Math.max(0,Math.min(TOUR.length-1,S.tour.i+d));S.tour.list=false;render()}
function tourPanel(){const T=S.tour,x=TOUR[T.i];
  if(!T.open)return `<button onclick="S.tour.open=true;render()" class="bg-primary text-white rounded-full px-4 py-2 shadow-lg">📘 สอนใช้</button>`;
  return `<div class="bg-white rounded-2xl shadow-2xl border w-[340px] max-w-[calc(100vw-24px)] pop">
    <div class="flex items-center justify-between px-4 pt-3"><button onclick="S.tour.list=!S.tour.list;render()" class="font-bold flex items-center gap-1.5">📘 สอนใช้ <span class="text-gray-400 font-normal">${T.i+1}/${TOUR.length}</span><i class="ph ph-caret-${T.list?'up':'down'}"></i></button>
      <button onclick="S.tour.open=false;render()" class="text-gray-400 hover:text-gray-700"><i class="ph ph-minus"></i></button></div>
    <div class="h-1 bg-gray-100 mx-4 mt-2 rounded"><div class="h-1 bg-primary rounded" style="width:${(T.i+1)/TOUR.length*100}%"></div></div>
    ${T.list?`<div class="max-h-72 overflow-y-auto p-2">${TOUR.map((y,i)=>`<button onclick="S.tour.i=${i};S.tour.list=false;render()" class="w-full text-left px-3 py-2 rounded-lg ${i===T.i?'bg-indigo-50 text-indigo-800 font-semibold':'hover:bg-gray-50'}">${i+1}. ${y.t}</button>`).join('')}</div>`:`
    <div class="px-4 pt-3 pb-1"><p class="font-semibold text-base mb-1.5">${T.i+1}. ${x.t}</p><div class="text-[13px] leading-relaxed text-gray-700">${x.b}</div></div>
    <div class="flex gap-2 px-4 pt-3">${x.go?`<button onclick="tourGo('go')" class="flex-1 rounded-xl border border-gray-300 py-2 font-medium hover:bg-gray-50">พาไปหน้านี้</button>`:''}${x.demo?`<button onclick="tourGo('demo')" class="flex-1 rounded-xl bg-primary text-white py-2 font-medium">▶ ทำให้ดู</button>`:''}</div>`}
    <div class="flex justify-between px-4 py-3"><button onclick="tourStep(-1)" class="text-gray-500 ${T.i?'':'invisible'}">‹ ก่อนหน้า</button><button onclick="tourStep(1)" class="text-primary font-semibold ${T.i<TOUR.length-1?'':'invisible'}">ถัดไป ›</button></div>
  </div>`}
function render(resetScroll){
  $('demo').innerHTML=S.view==='login'?'':demoPanel();$('tour').innerHTML=tourPanel();
  const scr=$('screen'),old=scr.querySelector('.view'),top=old&&lastView===S.view&&!resetScroll?old.scrollTop:0;
  scr.innerHTML=`<div class="view">${V[S.view]()}</div>${overlay()}`;
  const nv=scr.querySelector('.view');nv.scrollTop=top;lastView=S.view;
  if(S.view==='console'){const c=$('con');if(c)c.scrollTop=c.scrollHeight}
  if(S.view==='ssh'&&S.follow){const c=$('sshbox');if(c)c.scrollTop=c.scrollHeight}
}
setInterval(()=>{const d=new Date();$('clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(S.view==='console'&&S.serverOnline&&!S.modal){S.console.push(`[${nowStr().slice(11)}] heartbeat ok · lock free · clients 1`);if(S.console.length>60)S.console.shift();render()}},5000);
render();
</script>
</body>
</html>
